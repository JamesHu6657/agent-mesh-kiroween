name: Apply and test Carbon approval fixes

on:
  push:
    branches: [ci/carbon-apply]
    paths:
      - .github/workflows/carbon-apply.yml
      - .carbon/approvals.patch.gz.b64

permissions:
  contents: write

concurrency:
  group: carbon-approval-apply
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify and apply the tested patch to the fixed baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(Path('.carbon/approvals.patch.gz.b64').read_text()))
          expected = '58b10aec6770d21c3e53a87f0d6c50afc5ffcb21012c1bcc6b9245b27fab3b31'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          Path('/tmp/carbon-approvals.patch').write_bytes(patch)
          PY
          git checkout -b fix/carbon-review-approvals 1c099ecdc1de2e83fc148395c1b69aed4f843f57
          git apply --check /tmp/carbon-approvals.patch
          git apply --index /tmp/carbon-approvals.patch
          git diff --cached --check
          git diff --cached --stat
      - name: Install test runner and diagnostic reporter
        shell: bash
        run: |
          python3 -m pip install pytest
          cat > /tmp/report-tests.py <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for filename in sys.argv[1:]:
              path = Path(filename)
              if not path.exists():
                  print('::error title=Missing test report::' + filename)
                  continue
              root = ET.parse(path)
              cases = list(root.iter('testcase'))
              failed = 0
              for case in cases:
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      failed += 1
                      text = (case.get('classname', '') + '.' + case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:10000]
                      text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Test failure::' + text)
              skipped = sum(case.find('skipped') is not None for case in cases)
              print(f'::notice title=Test counts::{filename}: {len(cases)} total, {failed} failures/errors, {skipped} skipped')
          PY
      - name: Run unit suite excluding isolated timing-sensitive case
        shell: bash
        run: |
          set +e
          python3 -m pytest -q tests/unit --junitxml=/tmp/unit-results.xml \
            --deselect tests/unit/test_m3_gatefix.py::TestRound11SpawnAbortAndPostPopen::test_r11_spawn_abort_cumulative_pid_starttime_pairs_and_prior_members
          result=$?
          python3 /tmp/report-tests.py /tmp/unit-results.xml
          exit "$result"
      - name: Run isolated timing-sensitive case with one retry
        shell: bash
        run: |
          set -euo pipefail
          test_case='tests/unit/test_m3_gatefix.py::TestRound11SpawnAbortAndPostPopen::test_r11_spawn_abort_cumulative_pid_starttime_pairs_and_prior_members'
          python3 -m pytest -q "$test_case" --junitxml=/tmp/timing-results.xml || {
            echo '::warning::Process-starttime-sensitive case failed; retrying once in isolation.'
            python3 -m pytest -q "$test_case" --junitxml=/tmp/timing-results.xml || {
              python3 /tmp/report-tests.py /tmp/timing-results.xml
              exit 1
            }
          }
          python3 /tmp/report-tests.py /tmp/timing-results.xml
      - name: Run relevant integration and regression tests
        shell: bash
        run: |
          set +e
          python3 -m pytest -q --junitxml=/tmp/integration-results.xml \
            tests/integration/test_carbon_review_approvals.py \
            tests/integration/test_approvals.py \
            tests/integration/test_delegated_approval.py \
            tests/integration/test_projects.py \
            tests/integration/test_daemon.py
          result=$?
          python3 /tmp/report-tests.py /tmp/integration-results.xml
          exit "$result"
      - name: Commit and push only source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Carbon review approval lifecycle, redaction and audit findings'
          git push origin HEAD:refs/heads/fix/carbon-review-approvals
          {
            echo '## Carbon approval fixes published'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'Branch: fix/carbon-review-approvals'
            echo 'Unit suite, isolated timing-sensitive case, and related integration tests passed.'
            echo 'Temporary workflow and compressed patch are NOT part of the fix branch.'
          } >> "$GITHUB_STEP_SUMMARY"
